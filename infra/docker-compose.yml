services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: supportai_postgres
    restart: always
    environment:
      POSTGRES_USER: supportai
      POSTGRES_PASSWORD: supportai_dev
      POSTGRES_DB: supportai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportai -d supportai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: supportai_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
